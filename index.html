function tut(i){let[t,b]=TUT[i];scr(`<h1 class="sm">${t}</h1><div class="rule"></div><p style="text-align:left;font-size:14.5px">${b}</p><div class="row" style="margin-top:14px">${i?`<button class="big alt" onclick="tut(${i-1})">◀ Back</button>`:''}${i<TUT.length-1?`<button class="big alt" onclick="tut(${i+1})">Next ▶</button>`:'<button class="big" onclick="showTitle()">Done</button>'}</div><small>${i+1} / ${TUT.length}</small>`)}
const EMB=['🌿','⚒','☀','🌙','💰','🏹','🔥','⚡'];
function realmChips(){let h='';for(let i=0;i<=nbots;i++)h+=`<button class="rb ${i==realm?'on':''}" id="rb${i}" style="background:linear-gradient(180deg,${cols[i]},${shd(cols[i],-.5)});color:${cols[i]}" onclick="selRealm(${i})" title="${KN[i]}"><span style="filter:drop-shadow(0 1px 2px #000)">${EMB[i]}</span></button>`;return h}
function realmInfo(){let L=KL[realm];return `<b style="color:${cols[realm]}">${EMB[realm]} ${KN[realm]}</b> <i>· ${L[0]}</i><br>“${L[1]}” ${L[2]}`}
function selRealm(i){realm=i;$('realms').innerHTML=realmChips();$('rinfo').innerHTML=realmInfo()}
function setBots(n){nbots=n;if(realm>nbots)realm=0;selRealm(realm)}
function showTitle(){let nb='';for(let i=1;i<=7;i++)nb+=`<option value="${i}" ${i==nbots?'selected':''}>${i} rival${i>1?'s':''}</option>`;
 scr(`<div class="title-kicker">A living civilization sandbox · v4.1</div>${CREST}<h1>Kingdoms<span class="of">— of —</span>Chaos</h1><div class="tag">Shape the wilderness. Inherit a bloodline. Build the future.</div>
 <div class="title-feature-grid"><div><b>🗺 EXPLORE</b><small>Expanded realm · 6 biomes</small></div><div><b>🧬 INHERIT</b><small>Unique citizens · family genes</small></div><div><b>🏗 BUILD</b><small>Blueprints · builder civilians</small></div><div><b>💬 SOCIALISE</b><small>Relationships · readable dialogue</small></div><div><b>🏪 TRADE</b><small>Markets · stores · supermarkets</small></div></div><div class="rule"></div><div><input id="nick" placeholder="Your name, my liege" maxlength="14" value="${esc(nick)}" style="width:100%;text-align:center"></div>
 <div class="hint" style="margin-top:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase">Choose your realm</div><div class="realms" id="realms">${realmChips()}</div><div class="rinfo" id="rinfo">${realmInfo()}</div>
 <div class="row" style="margin-top:12px"><select id="nb" onchange="setBots(+this.value)" style="text-align:center">${nb}</select><select id="df" onchange="setDf(+this.value)" style="text-align:center" title="Rival difficulty">${DFS.map((d,i)=>`<option value="${i}" ${i==dfi?'selected':''}>${d.n}</option>`).join('')}</select></div>
 <div><button class="big" onclick="solo()">⚔ Begin Your Reign</button></div>
 <div class="row"><button class="big alt" onclick="tut(0)">📖 How to Play</button><button class="big alt" onclick="mkLobby()" ${ONLINE?'':'disabled title="Online play needs the Claude-hosted version"'}>🌐 Online Lobby</button></div>
 ${ONLINE?`<div class="row"><input id="jc" placeholder="Lobby code" maxlength="8" style="text-align:center"><button class="nf" onclick="joinL($('jc').value)" style="padding:9px 16px">Join</button></div>`:'<small>Online lobbies are only available in the Claude-hosted version. This copy is single-player.</small>'}`)}
const rn=()=>{nick=($('nick')&&$('nick').value.trim())||nick||'Player'+(10+Math.random()*89|0)};
function solo(){rn();realm=Math.min(realm,nbots);let b=Array(nbots+1).fill(true);b[realm]=false;startGame({role:'solo',seed:Math.random()*999|0,myT:realm,bots:b})}
function mkLobby(){rn();let a='abcdefghjkmnpqrstuvwxyz23456789',c='';for(let i=0;i<5;i++)c+=a[Math.random()*a.length|0];netJoin(c,true)}
function joinL(c){rn();c=String(c).toLowerCase().replace(/[^a-z0-9]/g,'');if(c)netJoin(c,false)}
async function netJoin(c,host){let r=null;try{r=await claude.use('room')}catch(e){}if(!r){toast('Online play is only available in the Claude-hosted version.',5000);return}
 code=c;role=host?'host':'client';ROOM=await r.join('k'+c);ROOM.presence({n:nick,h:host?1:0});
 ROOM.on('start',m=>{if(m.sameTab||host)return;go(m.data)});
 ROOM.on('cmd',m=>{if(role=='host'&&!m.sameTab&&PT[m.peer]!=null)handleCmd(PT[m.peer],m.data||{})});
 ROOM.on('snap',m=>{if(role=='client'&&playing&&m.data)applySnap(m.data.k,m.data.d)});
 ROOM.on('meta',m=>{let d=m.data;if(role!='client'||!playing||!d)return;d.R.forEach((r,i)=>{if(RS[i])Object.assign(RS[i],{food:r[0],wood:r[1],stone:r[2],gold:r[3]})});ally=d.a;gt=d.t;if(d.l)logs=d.l});
 ROOM.on('ev',m=>{if(m.data)onEv(m.data)});
 ROOM.on('end',m=>{if(role=='client'&&m.data)showEnd(m.data.w)});
 ROOM.onPeers(lobby);lobby()}
function lobby(){if(playing||!ROOM)return;let ps=ROOM.peers().filter(p=>p.kind=='viewer'),link=ARTURL+'#'+code,hn=role=='host';
 scr(`<h1 class="sm">Lobby</h1><div class="rule"></div><div>Code: <b style="font-size:28px;letter-spacing:4px">${code.toUpperCase()}</b></div><div><input readonly value="${link}" style="width:100%" onclick="this.select()"></div>
 <div class="pl"><b>Players (${ps.length}/8)</b><br>${ps.map(p=>`${p.presence&&p.presence.h?'👑':'🙂'} ${esc((p.presence&&p.presence.n)||'Player')}${p.isMe&&p.sameTab?' (you)':''}`).join('<br>')}${hn?`<br>🤖 × ${Math.max(0,Math.min(nbots,8-ps.length))} bots`:''}</div>
 ${hn?`<div>Bots: <button onclick="nbots=Math.max(0,nbots-1);lobby()">−</button> <b>${nbots}</b> <button onclick="nbots=Math.min(7,nbots+1);lobby()">+</button></div><div><button class="big" onclick="startL()">▶ Start Game</button></div>`:'<div>Waiting for the host to start…</div>'}
 <div><button class="big alt" onclick="home()">Leave</button></div>`)}
function startL(){let ps=ROOM.peers().filter(p=>p.kind=='viewer').sort((a,b)=>(b.presence.h|0)-(a.presence.h|0)||(a.peer<b.peer?-1:1)).slice(0,8),nb=Math.min(nbots,8-ps.length);
 if(ps.length+nb<2){toast('Add a bot or wait for a friend');return}
 let d={s:Math.random()*999|0,o:ps.map(p=>p.peer),b:nb};ROOM.emit('start',d);go(d)}
function go(d){let me=ROOM.peers().find(p=>p.isMe&&p.sameTab);d.o.forEach((p,i)=>PT[p]=i);let n=d.o.length;
 startGame({role,seed:d.s,myT:d.o.indexOf(me.peer),bots:[...Array(n).fill(false),...Array(d.b).fill(true)]})}
let last=performance.now();(function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;
 if(playing){if(!paused){time+=dt;if(!over)gt+=dt;
   if(role=='client')interp(dt);else if(!over){upd(dt);if(role=='host'){snapT-=dt;if(snapT<=0){snapT=.25;sendSnap()}}}}
  let sp=500*dt/cam.z;if(keys.w||keys.arrowup)cam.y-=sp;if(keys.s||keys.arrowdown)cam.y+=sp;if(keys.a||keys.arrowleft)cam.x-=sp;if(keys.d||keys.arrowright)cam.x+=sp;draw(paused?0:dt);ui(dt)}
 else drawTitle(dt);
 muTick(dt);sfAmb(dt);requestAnimationFrame(loop)})(last);
$('ver').textContent='Kingdoms of Chaos · v4.1 · Social Life & Commerce';mtBuild();showTitle();
{let hc=(location.hash||'').replace(/[^a-z0-9]/gi,'').toLowerCase();if(hc&&$('jc')){$('jc').value=hc;toast('Invite code '+hc.toUpperCase()+' filled in. Enter your name and press Join',6000)}}
</script></body></html>
