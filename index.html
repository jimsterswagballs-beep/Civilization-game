<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kingdoms of Chaos</title>
<style>
:root{--bg:#10180f;--wood:#2a1d12;--wood2:#3b2916;--panel:rgba(32,22,13,.93);--edge:#7a5530;--gold:#f2c14e;--gold2:#ffe39a;--t:#fbf0d4;--dim:#c9b58a;--red:#e0564a;--green:#7fd36a;
 --serif:'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;--sans:'Trebuchet MS','Segoe UI',Verdana,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--t);user-select:none;-webkit-user-select:none}
canvas#c{display:block;position:absolute;inset:0;cursor:default}
canvas#tc{position:absolute;inset:0;z-index:7;display:block}
#hud{display:none}
.p{position:absolute;background:linear-gradient(180deg,rgba(52,37,22,.95),rgba(30,21,12,.95));border:1px solid var(--edge);border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,225,160,.14),inset 0 0 0 1px rgba(0,0,0,.4);backdrop-filter:blur(7px);transition:box-shadow .18s ease,border-color .18s ease,background .18s ease}
b{color:var(--gold2)}
button{background:linear-gradient(180deg,#8a5c30,#64401f);color:var(--t);border:1px solid #d2a566;border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;box-shadow:0 2px 0 #35200d,inset 0 1px 0 rgba(255,235,190,.3);transition:filter .14s ease,transform .14s ease,box-shadow .16s ease,background .16s ease}

input[type=range]{padding:0;accent-color:var(--gold);width:84px;vertical-align:middle}
/* HUD */
#lc{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;display:flex;flex-direction:column;gap:8px;width:min(440px,60vw);pointer-events:none}

.chip i{font-style:normal;font-size:16px}.chip small{font-weight:normal;color:var(--green);font-size:10px}
.chip.bad{color:#ff9a8c;border-color:rgba(255,120,100,.5)}
#clk{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:14px;color:var(--gold2);padding-right:4px;white-space:nowrap}
#log{font-size:12px;line-height:1.45;pointer-events:none!important;background:linear-gradient(180deg,rgba(24,17,10,.72),rgba(24,17,10,.5));max-height:200px;overflow:hidden}
#log div{margin:1px 0;animation:fi .5s}#log div:nth-last-child(n+6){opacity:.55}#log b{color:var(--gold)}

#rc{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;flex-direction:column;gap:8px;width:208px;align-items:stretch}

.kc{display:flex;align-items:center;gap:7px;padding:5px 6px;margin:4px 0;border-radius:8px;background:rgba(0,0,0,.26);border-left:4px solid #fff}
.kc .kn{flex:1;min-width:0;line-height:1.25}.kc .kn span{display:block;color:var(--dim);font-size:10px}

#bar .sep{width:1px;background:rgba(255,220,150,.2);margin:2px 4px}
#bt{display:none;position:absolute;z-index:6;max-width:300px;pointer-events:none;font-size:12px;line-height:1.45}
#bt h5{margin:0 0 3px;font-family:var(--serif);font-size:15px;color:var(--gold2)}#bt .ef{color:var(--green);margin-top:4px}#bt .lo{color:var(--dim);font-style:italic}
#sel{bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;width:372px;min-height:150px;max-height:72vh;overflow:auto;padding:10px 12px}
.life-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}.life-stat{background:rgba(0,0,0,.25);border:1px solid rgba(255,220,150,.12);border-radius:8px;padding:5px 7px;font-size:11px}.life-stat span{display:flex;justify-content:space-between;color:var(--dim);gap:7px}.life-stat b{font-weight:600;color:var(--t)}.need{height:5px;background:#0009;border-radius:9px;overflow:hidden;margin-top:4px}.need i{display:block;height:100%;border-radius:9px;transition:width .4s ease}.life-section{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,220,150,.15)}.life-section h5{margin:0 0 5px;color:var(--gold2);font-family:var(--serif);font-size:13px}.life-memory{font-size:11px;line-height:1.4;padding:4px 6px;margin:3px 0;background:rgba(0,0,0,.22);border-left:2px solid #997344;border-radius:4px}.life-memory small{display:block;color:var(--dim);font-size:9px}.life-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.life-actions button{font-size:11px}.ruler-box{margin-top:8px;padding:8px;border-radius:9px;background:rgba(0,0,0,.25);border:1px solid rgba(255,220,150,.18)}.ruler-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.ruler-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.ruler-actions button{padding:4px 7px;font-size:10px}.ruler-actions button.active{background:linear-gradient(180deg,#ffd36b,#d9a02e);color:#2b1d0b}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.pt{width:88px;height:88px;border-radius:12px;border:2px solid var(--edge);background:#0007;flex:none;box-shadow:inset 0 0 14px #000a}
.pn{font-family:var(--serif);font-size:19px;font-weight:bold;color:var(--gold2);line-height:1.15}.pn em{font-style:italic;font-size:14px;color:var(--gold);font-weight:normal}
.ps{color:var(--dim);font-size:12px;margin:2px 0 5px}
.tg{display:flex;flex-wrap:wrap;gap:4px}.tg span{font-size:10px;padding:1px 8px;border-radius:999px;background:rgba(255,220,150,.12);border:1px solid rgba(255,220,150,.28);color:var(--gold2)}
.pb{font-size:12.5px;line-height:1.5;color:#efe3c3;margin:6px 0 8px}.pb i{color:var(--dim)}
.bar{height:9px;border-radius:5px;background:#000a;border:1px solid #000;overflow:hidden;margin:3px 0 7px;position:relative}.bar>div{height:100%;border-radius:4px}
.bl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}.bl b{font-weight:normal;color:var(--t)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:4px 0 8px;font-size:12px}.gr div{background:rgba(0,0,0,.25);border-radius:7px;padding:3px 8px;display:flex;justify-content:space-between;gap:6px}.gr span{color:var(--dim)}
.act{font-size:12px;padding:5px 9px;border-radius:8px;background:rgba(127,211,106,.12);border:1px solid rgba(127,211,106,.3);color:#cdeebf}

.mi{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.mi span{font-size:11px;background:rgba(0,0,0,.3);border-radius:6px;padding:2px 7px}
#mm{bottom:calc(8px + env(safe-area-inset-bottom,0px));right:8px;padding:0;width:170px;height:170px;cursor:pointer;border-radius:50%;border:2px solid var(--edge);overflow:hidden}

#now{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;transition:all .7s;font-family:var(--serif);font-size:13px;color:var(--gold2);padding:5px 16px;z-index:5;pointer-events:none;white-space:nowrap}

#pr,#tt{display:none;top:96px;left:50%;transform:translateX(-50%);text-align:center;z-index:9;max-width:90vw}
#end{inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;font-weight:bold;background:radial-gradient(circle,rgba(0,0,0,.45),rgba(0,0,0,.85));border:0;border-radius:0;text-align:center;z-index:9;gap:8px;color:var(--gold2);text-shadow:0 4px 20px #000}

#pz{inset:0;display:none;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;background:rgba(0,0,0,.45);border:0;border-radius:0;z-index:6;color:var(--gold2)}
/* title / menus */
#scr{inset:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:0;box-shadow:none;z-index:8;overflow:auto;padding:16px}
.card{max-width:520px;width:100%;text-align:center;line-height:1.5;padding:22px 26px;border-radius:18px;background:linear-gradient(180deg,rgba(38,26,16,.84),rgba(14,10,8,.9));border:1px solid rgba(210,165,102,.55);box-shadow:0 20px 70px #000c,inset 0 1px 0 rgba(255,225,160,.2),0 0 0 4px rgba(0,0,0,.35);backdrop-filter:blur(5px);animation:rise .8s cubic-bezier(.2,.8,.2,1)}

.tag{font-family:var(--serif);font-style:italic;color:var(--dim);margin:8px 0 14px;font-size:15px}
.rule{height:1px;margin:14px 0;background:linear-gradient(90deg,transparent,rgba(242,193,78,.55),transparent)}
.card>div{margin:9px 0}
.big{width:100%;font-family:var(--serif);font-size:19px;letter-spacing:.06em;padding:11px 16px;border-radius:12px;border:1px solid #ffe39a;background:linear-gradient(180deg,#e9b447,#a8691b);color:#2a1706;font-weight:bold;text-shadow:0 1px 0 rgba(255,235,170,.6);box-shadow:0 4px 0 #52300a,0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,245,200,.7)}
.big:hover{filter:brightness(1.12)}.big.alt{background:linear-gradient(180deg,#7a5a3a,#50351d);color:var(--t);border-color:#c59a5a;text-shadow:none;font-size:15px;padding:9px 12px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}.row>.nf{flex:none}
.realms{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rb{width:42px;height:50px;padding:0;border-radius:8px 8px 20px 20px;border:2px solid rgba(255,255,255,.25);font-size:18px;display:flex;align-items:center;justify-content:center}
.rb.on{border-color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 0 18px currentColor}
.rinfo{font-size:13px;min-height:58px;background:rgba(0,0,0,.28);border-radius:10px;padding:8px 12px;border:1px solid rgba(255,220,150,.14)}.rinfo b{font-family:var(--serif);font-size:16px}.rinfo i{color:var(--dim)}
.card .pl{text-align:left;background:rgba(0,0,0,.28);border-radius:8px;padding:8px 12px}
.card small{color:var(--dim)}.card p{margin:8px 0}
.mt{position:absolute;right:14px;bottom:12px;z-index:8;font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:999px;border:1px solid rgba(255,220,150,.2)}

@media(max-width:900px){#bar{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}#sel{bottom:96px;width:min(372px,92vw);max-height:44vh}#mm{width:110px;height:110px;bottom:96px}#rc{width:170px}#help{display:none}.card h1{font-size:32px}}
/* v4 worldbuilding UI */

#bar{left:318px;right:178px;gap:4px;padding:7px 8px;background:linear-gradient(145deg,rgba(22,33,39,.94),rgba(8,14,19,.95));border-color:rgba(130,199,204,.35);box-shadow:0 12px 34px #000b,inset 0 1px #ffffff10}

/* Online play through a relay server (see relay/server.js).
   Set RELAY_DEFAULT to your server's address (wss://...), or open the game with ?relay=wss://your-server
   Every player must use the same relay address. Invite links keep the address. */
(function(){
 const RELAY_DEFAULT='';
 const relay=new URLSearchParams(location.search).get('relay')||RELAY_DEFAULT;
 if(!relay||typeof WebSocket!=='function')return;
 function connect(name){return new Promise((res,rej)=>{
  const ws=new WebSocket(relay);let id=null,list=[],joined=false,presence={};
  const handlers={},peerCbs=[];
  const send=o=>{if(ws.readyState===1)ws.send(JSON.stringify(o))};
  const api={
   on(ev,cb){(handlers[ev]=handlers[ev]||[]).push(cb)},
   emit(ev,data){send({t:'emit',ev,data})},
   presence(o){presence=o||{};send({t:'presence',presence})},
   peers(){return list.map(p=>({peer:p.peer,kind:'viewer',presence:p.presence,isMe:p.peer===id,sameTab:false}))},
   onPeers(cb){peerCbs.push(cb)},
   leave(){try{ws.close()}catch(e){}}
  };
  ws.onopen=()=>send({t:'join',room:name,presence});
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(err){return}
   if(m.t==='joined'){id=m.id;if(!joined){joined=true;res(api)}}
   else if(m.t==='peers'){list=m.list||[];peerCbs.forEach(f=>{try{f()}catch(err){console.error(err)}})}
   else if(m.t==='msg'){(handlers[m.ev]||[]).forEach(f=>{try{f({data:m.data,peer:m.from,sameTab:false})}catch(err){console.error(err)}})}
   else if(m.t==='error'&&!joined){rej(new Error(m.msg||'Lobby error'));try{ws.close()}catch(err){}}
  };
  ws.onerror=()=>{if(!joined)rej(new Error('Could not reach the relay server'))};
  ws.onclose=()=>{if(!joined)rej(new Error('Relay connection closed'))};
 })}
 window.claude={use:async n=>n==='room'?{join:connect}:null};
})();
